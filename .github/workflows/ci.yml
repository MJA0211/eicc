name: EICC verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: eicc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.12.6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check backend tests migrations scripts
      - run: uv run pytest --cov=backend --cov-report=term-missing --cov-report=xml --junitxml=pytest-results.xml
      - run: uv run pip-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-evidence
          path: |
            pytest-results.xml
            coverage.xml
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv==0.12.6
      - run: uv sync --frozen
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=low
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
            docs/screenshots
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/init_env.py
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml run --build --rm tests
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
        env:
          EICC_BASE_URL: http://127.0.0.1:8080
      - run: docker compose logs --no-color > docker-verification.log
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-evidence
          path: |
            docker-verification.log
            frontend/playwright-report
            frontend/test-results
      - run: docker compose down
        if: always()
