name: eicc
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eicc
      POSTGRES_USER: eicc
      POSTGRES_PASSWORD: ${EICC_POSTGRES_PASSWORD:?Set a private EICC_POSTGRES_PASSWORD in .env}
    volumes:
      - eicc_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U eicc -d eicc"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
      target: backend
    environment:
      EICC_DATABASE_URL: postgresql+psycopg://eicc:${EICC_POSTGRES_PASSWORD}@postgres:5432/eicc
      EICC_DEMO_MODE: ${EICC_DEMO_MODE:-true}
      EICC_SECURE_COOKIES: ${EICC_SECURE_COOKIES:-false}
      EICC_ALLOWED_ORIGINS: ${EICC_ALLOWED_ORIGINS:-["http://localhost:8080","http://127.0.0.1:8080"]}
      EICC_ADMIN_EMAIL: ${EICC_ADMIN_EMAIL:-}
      EICC_ADMIN_PASSWORD: ${EICC_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${EICC_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
volumes:
  eicc_postgres:
